openapi: 3.0.0
info:
  title: pkimetal Experimental MTC Fork API
  description: >-
    API definition for a separately deployed experimental pkimetal fork with
    MTC draft-05 and CQRP v0.2.0 linting. It does not describe capabilities of
    the upstream hosted services or container images.
  contact:
    name: Upstream pkimetal project (base implementation)
    url: https://github.com/pkimetal/pkimetal
  license:
    name: GNU General Public License v3.0 or later
    url: https://spdx.org/licenses/GPL-3.0-or-later.html
  version: 1.0.3

security: []

servers:
  - url: http://localhost:8080
    description: Experimental local fork deployment

paths:
  /lintcert:
    post:
      operationId: lintcert
      summary: Lint a Certificate
      description: >-
        Lints a complete X.509 Certificate or Precertificate. Experimental MTC
        draft-05 and CQRP v0.2.0 linting is selected with an explicit MTC
        profile; autodetection never selects CQRP.
      tags:
        - cert
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Severity'
      requestBody:
        $ref: '#/components/requestBodies/CertificateLintRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LintingSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'
  /linttbscert:
    post:
      operationId: linttbscert
      summary: Lint a to-be-signed Certificate
      description: >-
        Lints an X.509 TBSCertificate by constructing the form needed by
        compatible linters. MTC checks that require outer Certificate or proof
        fields do not apply to this endpoint.
      tags:
        - cert
      parameters:
        - $ref: '#/components/parameters/Profile'
        - $ref: '#/components/parameters/Format'
        - $ref: '#/components/parameters/Severity'
      requestBody:
        $ref: '#/components/requestBodies/TBSCertificateLintRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LintingSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'

  /lintcrl:
    post:
      operationId: lintcrl
      summary: Lint a CRL
      description: Lints a X.509 certificate revocation list (CRL)
      tags:
        - crl
      requestBody:
        $ref: '#/components/requestBodies/LintRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LintingSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'
  /linttbscrl:
    post:
      operationId: linttbscrl
      summary: Lint a to-be-signed CRL
      description: Creates and lints a X.509 certificate revocation list (CRL) from the specified TBSCertList
      tags:
        - crl
      requestBody:
        $ref: '#/components/requestBodies/LintRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LintingSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'

  /lintocsp:
    post:
      operationId: lintocsp
      summary: Lint an OCSP Response
      description: Lints an OCSP response
      tags:
        - ocsp
      requestBody:
        $ref: '#/components/requestBodies/LintRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LintingSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'
  /linttbsocsp:
    post:
      operationId: linttbsocsp
      summary: Lint a to-be-signed OCSP Response
      description: Creates and lints an OCSP response from the specified ResponseData
      tags:
        - ocsp
      requestBody:
        $ref: '#/components/requestBodies/LintRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/LintingSuccessful'
        '400':
          $ref: '#/components/responses/BadRequest'

  /profiles:
    get:
      operationId: profiles
      summary: List linting profiles
      description: Retrieves the profiles available for linting
      tags:
        - meta
      responses:
        '200':
          description: A list of profiles available for linting
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LintProfile'
        '404':
          description: Not found

  /linters:
    get:
      operationId: linters
      summary: List linters
      description: Retrieves the linters available for linting
      tags:
        - meta
      responses:
        '200':
          description: A list of linters available for linting
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Linter'
        '404':
          description: Not found

components:
  parameters:
    Profile:
      name: profile
      in: query
      required: false
      description: >-
        Profile name. MTC values are mtc_ca, mtc_subscriber, cqrp_mtc_ca, and
        cqrp_mtc_subscriber. Omit or use autodetect for structural detection;
        CQRP profiles must be explicit. Other legacy profile names remain
        supported and are intentionally not constrained by an enum.
      schema:
        type: string
        default: autodetect
    Format:
      name: format
      in: query
      required: false
      description: Response format; overrides Accept when present.
      schema:
        $ref: '#/components/schemas/ResponseFormat'
    Severity:
      name: severity
      in: query
      required: false
      description: Minimum included severity. Use meta to include status metadata.
      schema:
        $ref: '#/components/schemas/FindingSeverity'

  requestBodies:
    LintRequestBody:
      description: The parameters for the linting request
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/LintRequest'

    CertificateLintRequestBody:
      description: >-
        A PEM/Base64 form value or a raw complete DER Certificate. For raw DER,
        send profile, format, and severity as query parameters.
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/LintRequest'
          examples:
            mtcCA:
              summary: Explicit MTC CA profile
              value:
                b64input: BASE64_OR_PEM_CERTIFICATE_FROM_THE_CALLER
                profile: mtc_ca
                format: json
            cqrpMTCSubscriber:
              summary: Explicit CQRP MTC subscriber profile
              value:
                b64input: BASE64_OR_PEM_CERTIFICATE_FROM_THE_CALLER
                profile: cqrp_mtc_subscriber
                format: json
        application/pkix-cert:
          schema:
            type: string
            format: binary
          examples:
            completeCertificate:
              summary: Caller-provided complete DER Certificate
              description: Binary body; no certificate bytes are fabricated here.
              value: CALLER_PROVIDED_DER_CERTIFICATE

    TBSCertificateLintRequestBody:
      description: >-
        A PEM/Base64 form value or a raw DER TBSCertificate. For raw DER, send
        profile, format, and severity as query parameters.
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            $ref: '#/components/schemas/LintRequest'
          examples:
            mtcSubscriber:
              summary: Explicit MTC subscriber profile
              value:
                b64input: BASE64_OR_PEM_TBS_CERTIFICATE_FROM_THE_CALLER
                profile: mtc_subscriber
                format: json
            cqrpMTCCA:
              summary: Explicit CQRP MTC CA profile
              value:
                b64input: BASE64_OR_PEM_TBS_CERTIFICATE_FROM_THE_CALLER
                profile: cqrp_mtc_ca
                format: json
        application/octet-stream:
          schema:
            type: string
            format: binary
          examples:
            tbsCertificate:
              summary: Caller-provided DER TBSCertificate
              description: Binary body; no certificate bytes are fabricated here.
              value: CALLER_PROVIDED_DER_TBS_CERTIFICATE

  responses:
    BadRequest:
      description: >-
        HTTP 400 for an empty body, unsupported media type, invalid PEM/Base64,
        Certificate or TBSCertificate parse failure, or unrecognised
        input/profile/severity/format. A recognized response format uses its
        normal representation. JSON is a one-item LintResponse with a pkimetal
        fatal finding and usually no Code or Field. An invalid format may return
        an empty text body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LintResponse'
          example:
            - Linter: pkimetal
              Finding: Unrecognised input
              Severity: fatal
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string
          examples:
            parseFailure:
              value: "pkimetal\tFATAL\tUnrecognised input\n"
            invalidFormat:
              summary: An unrecognised format can have an empty body
              value: ''

    LintingSuccessful:
      description: >-
        HTTP 200 lint result. A malformed MTC proof is a successful request with
        a fatal lint finding, not an HTTP 400 parse error. At severity=meta the
        array also includes the selected profile, native linter versions, and
        availability/applicability or skip-reason items.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LintResponse'
          examples:
            metadataAndSkip:
              summary: Selected profile, native version, and exact zcrypto skip reason
              value:
                - Linter: pkimetal
                  Finding: "Profile: mtc_subscriber; Version: <pkimetal-version>"
                  Severity: meta
                - Linter: mtclint
                  Finding: "Queued: <duration>; Runtime: <duration>; Version: draft-05"
                  Severity: meta
                - Linter: zlint
                  Finding: "zlint: Not used [Available:true, Applicable:false] [Reason:zcrypto could not safely parse this MTC artifact]"
                  Severity: meta
            cqrpMetadata:
              summary: CQRP runs both native linters
              value:
                - Linter: pkimetal
                  Finding: "Profile: cqrp_mtc_subscriber; Version: <pkimetal-version>"
                  Severity: meta
                - Linter: cqrplint
                  Finding: "Queued: <duration>; Runtime: <duration>; Version: v0.2.0"
                  Severity: meta
                - Linter: mtclint
                  Finding: "Queued: <duration>; Runtime: <duration>; Version: draft-05"
                  Severity: meta
            malformedMTCProof:
              summary: A malformed proof is an HTTP 200 fatal lint finding
              value:
                - Linter: mtclint
                  Finding: MTCProof is malformed
                  Field: signatureValue
                  Code: f_mtc_proof_malformed
                  Severity: fatal
        text/html:
          schema:
            type: string
        text/plain:
          schema:
            type: string

  schemas:
    FindingSeverity:
      type: string
      enum:
        - meta
        - debug
        - info
        - notice
        - warning
        - error
        - bug
        - fatal
      description: The severity of a linter finding

    ResponseFormat:
      type: string
      enum:
        - json
        - html
        - text
      description: The response format
      default: json

    LintRequest:
      type: object
      required:
        - b64input
      properties:
        b64input:
          type: string
          description: >-
            The caller's Base64 or PEM-encoded input. Endpoint-specific aliases
            such as b64cert and b64tbscert are also accepted.
        format:
          $ref: '#/components/schemas/ResponseFormat'
        profile:
          type: string
          description: >-
            Profile name. The four MTC values are mtc_ca, mtc_subscriber,
            cqrp_mtc_ca, and cqrp_mtc_subscriber. Legacy names remain supported,
            so this property intentionally has no enum.
          default: autodetect
        severity:
          $ref: '#/components/schemas/FindingSeverity'

    LintResponse:
      type: array
      description: >-
        Flat result array. Metadata uses the same item schema as lint findings;
        there is no separate meta object.
      items:
        $ref: '#/components/schemas/LintFinding'

    LintFinding:
      type: object
      required:
        - Linter
        - Finding
        - Severity
      properties:
        Linter:
          type: string
          description: The linter name, including pkimetal for request/profile metadata.
        Finding:
          type: string
          description: >-
            Finding or metadata text. Skipped linters report Available and
            Applicable booleans and an optional Reason in this field.
        Severity:
          $ref: '#/components/schemas/FindingSeverity'
        Code:
          type: string
          description: A unique identifier for the finding
        Field:
          type: string
          description: The field within the document that is applicable to the finding

    LintProfile:
      type: object
      required:
        - Name
        - Description
      properties:
        Name:
          type: string
          description: The name of the profile
        Description:
          type: string
          description: A textual description of the profile
        Source:
          type: string
          description: The document in which the profile is defined
        Linters:
          type: array
          items:
            type: string
          description: The linters that handle this profile

    Linter:
      type: object
      required:
        - Name
        - Instances
        - Version
        - Url
      properties:
        Name:
          type: string
          description: The name of the linter
        Instances:
          type: integer
          description: The number of instances of the linter that are currently running
        Version:
          type: string
          description: The version number of the linter
        Url:
          type: string
          format: uri
          description: The home page for the linter project

tags:
  - name: cert
    description: Operations related to X.509 certificates
  - name: crl
    description: Operations related to X.509 certificate revocation lists (CRLs)
  - name: meta
    description: Operations related to pkimetal itself
  - name: ocsp
    description: Operations related to OCSP responses
