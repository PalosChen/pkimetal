name: Go verification

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare x509lint sources
        shell: bash
        run: |
          go mod download github.com/kroeckx/x509lint
          module_dir="$(go list -m -f '{{.Dir}}' github.com/kroeckx/x509lint)"
          cp "${module_dir}"/{asn1_time.c,asn1_time.h,checks.c,checks.h,messages.c,messages.h} linter/x509lint/
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./mtc -run Fuzz -count=1
